<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f4f0;
    --card: #ffffff;
    --line: #ececec;
    --text: #1a1a1a;
    --text-dim: #8a8a8a;
    --orange-a: #ff8a3d;
    --orange-b: #ff5f6d;
    --check: #ff7a45;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
  }

  .page{ max-width:480px; margin:0 auto; padding:0 0 40px; }

  .card{
    background: var(--card);
    overflow:hidden;
    min-height:100vh;
  }

  /* ---- Top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background: linear-gradient(135deg, var(--orange-a), var(--orange-b));
    color:#fff;
  }
  .topbar .side-btn{
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    border:none; color:#fff; cursor:pointer;
  }
  .topbar .side-btn svg{ width:15px; height:15px; }
  .topbar-title{ text-align:center; }
  .topbar-title .lock-line{
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:13px; font-weight:600;
  }
  .topbar-title .lock-line svg{ width:12px; height:12px; }
  .topbar-title .sub{ font-size:11px; opacity:0.85; margin-top:1px; }

  /* ---- Cover + Avatar ---- */
  .cover-wrap{ position:relative; }
  .cover{ height:150px; width:100%; object-fit:cover; display:block; background:#eee; }

  .profile-block{ padding:0 20px 8px; margin-top:-40px; position:relative; }
  .avatar{
    width:80px; height:80px; border-radius:50%;
    border:4px solid var(--card);
    object-fit:cover; display:block; background:#ddd;
  }
  .name-row{ display:flex; align-items:center; gap:6px; margin-top:10px; }
  .name-row h1{ font-size:19px; font-weight:700; margin:0; }
  .username{ font-size:13px; color:var(--text-dim); margin:2px 0 0; }

  /* ---- Benefits ---- */
  .section{ padding:18px 20px; border-top:1px solid var(--line); }
  .section h2{ font-size:16px; font-weight:700; margin:0 0 14px; }
  .benefit-item{
    display:flex; align-items:center; gap:10px;
    font-size:14.5px; color:var(--text); margin-bottom:12px;
  }
  .benefit-item svg{ width:18px; height:18px; color:var(--check); flex-shrink:0; }

  /* ---- Payment ---- */
  .value-label{ font-size:12px; color:var(--text-dim); margin-bottom:2px; }
  .value-amount{ font-size:26px; font-weight:800; margin-bottom:18px; }

  .pix-box{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:30px;
    padding:12px 16px; margin-bottom:14px;
  }
  .pix-box input{
    flex:1; border:none; outline:none; font-family:'Poppins', sans-serif;
    font-size:12.5px; color:var(--text-dim); background:transparent;
    overflow:hidden; text-overflow:ellipsis;
  }

  .btn-copy{
    display:block; width:100%; text-align:center;
    background: linear-gradient(90deg, var(--orange-a), var(--orange-b));
    color:#fff; border:none; border-radius:30px;
    padding:15px; font-family:'Poppins', sans-serif;
    font-size:14.5px; font-weight:700; cursor:pointer;
    margin-bottom:18px;
    box-shadow: 0 6px 18px rgba(255,110,80,0.3);
  }
  .btn-copy.copied{ background:#2ecc71; }

  .divider-or{
    display:flex; align-items:center; gap:10px;
    color:var(--text-dim); font-size:11px; margin:16px 0;
  }
  .divider-or::before, .divider-or::after{ content:""; flex:1; height:1px; background:var(--line); }

  .btn-apple{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; background:#000; color:#fff; border:none; border-radius:30px;
    padding:14px; font-family:'Poppins', sans-serif; font-size:15px; font-weight:600;
    cursor:pointer; margin-bottom:14px;
  }
  .btn-apple svg{ width:18px; height:18px; }

  .btn-card{
    display:block; width:100%; text-align:center; background:none;
    border:none; color:var(--text-dim); font-family:'Poppins', sans-serif;
    font-size:13.5px; font-weight:600; padding:6px; cursor:pointer;
    text-decoration:underline;
  }

  .status-msg{
    font-size:12px; text-align:center; color:var(--text-dim);
    margin-top:10px; min-height:16px;
  }

  .lock-note{
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:11px; color:var(--text-dim); margin-top:18px;
  }
  .lock-note svg{ width:11px; height:11px; }
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <div class="topbar">
      <button class="side-btn" onclick="window.close()" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="topbar-title">
        <div class="lock-line">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          <span id="brandName">Privacy</span>
        </div>
        <div class="sub">Checkout seguro</div>
      </div>
      <button class="side-btn" aria-label="Voltar" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="cover-wrap">
      <img class="cover" id="coverImg" src="https://i.postimg.cc/vTcspjMx/Design-sem-nome-(1).png" alt="capa">
    </div>

    <div class="profile-block">
      <img class="avatar" id="avatarImg" src="https://i.postimg.cc/T2FMKtfJ/Gccoa-SUXYAAGu-Tw-(1).jpg" alt="avatar">
      <div class="name-row">
        <h1 id="profileName">Carolina</h1>
      </div>
      <div class="username" id="profileUsername">@carolinaaonf</div>
    </div>

    <div class="section">
      <h2>Benefícios exclusivos</h2>
      <div class="benefit-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l4 4 10-10"/></svg>
        Acesso ao conteúdo completo
      </div>
      <div class="benefit-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l4 4 10-10"/></svg>
        Chat exclusivo direto comigo
      </div>
      <div class="benefit-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l4 4 10-10"/></svg>
        Cancele quando quiser
      </div>
    </div>

    <div class="section">
      <h2>Formas de pagamento</h2>

      <div class="value-label">Valor</div>
      <div class="value-amount" id="valueAmount">R$ 23,99</div>

      <div class="pix-box">
        <input type="text" id="pixCode" readonly value="Gerando código Pix...">
      </div>
      <div id="qrWrap" style="display:none; text-align:center; margin-bottom:14px;">
        <img id="qrImage" alt="QR Code Pix" style="width:180px; height:180px; border-radius:12px; border:1px solid var(--line);">
      </div>
      <button class="btn-copy" id="copyBtn">Copiar chave Pix</button>
      <div class="status-msg" id="statusMsg"></div>

      <div class="divider-or">ou</div>

      <button class="btn-apple" id="appleBtn">
        <svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Pay
      </button>

      <button class="btn-card" id="cardBtn">Pagar com cartão de crédito</button>

      <div class="lock-note">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        Pagamento processado com segurança
      </div>
    </div>

  </div>
</div>

<script>
  /* ============================================================
     CONFIGURAÇÃO
     ============================================================ */

  // Marca/nome exibido no topo
  document.getElementById('brandName').textContent = "Marca";

  // Valor da cobrança (em reais, formato numérico — usado na chamada da API)
  const VALUE_BRL = 23.99;

  // URL da SUA função serverless (Vercel) que fala com a Dotfy.
  // Depois de subir a pasta api/ na Vercel, troque pela URL real, tipo:
  // https://seu-projeto.vercel.app/api/gerar-pix
  const PIX_WEBHOOK_URL = "https://carolina-privacy.vercel.app/api/gerar-pix";

  // URL do checkout de cartão (Checkout Pro / Bricks do Mercado Pago, ou
  // outra página sua que trate pagamento via cartão)
  const CARD_CHECKOUT_URL = "https://carolina-privacy.vercel.app/api/gerar-pix";

  /* ============================================================ */

  const pixInput = document.getElementById('pixCode');
  const copyBtn = document.getElementById('copyBtn');
  const statusMsg = document.getElementById('statusMsg');
  const valueAmount = document.getElementById('valueAmount');

  valueAmount.textContent = 'R$ ' + VALUE_BRL.toFixed(2).replace('.', ',');

  const qrWrap = document.getElementById('qrWrap');
  const qrImage = document.getElementById('qrImage');

  // Gera o Pix chamando sua função serverless assim que a página carrega
  async function gerarPix() {
    try {
      statusMsg.textContent = 'Gerando código Pix...';
      const resp = await fetch(PIX_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ valor: VALUE_BRL, descricao: 'Assinatura', referencia: 'checkout_' + Date.now() })
      });
      const data = await resp.json();

      if (data && data.success && data.pix_copia_cola) {
        pixInput.value = data.pix_copia_cola;
        if (data.qr_code_image) {
          qrImage.src = data.qr_code_image;
          qrWrap.style.display = 'block';
        }
        statusMsg.textContent = '';
      } else {
        statusMsg.textContent = 'Não foi possível gerar o Pix agora.';
      }
    } catch (err) {
      statusMsg.textContent = 'Erro ao gerar o Pix. Tente novamente.';
      console.error(err);
    }
  }

  gerarPix();

  copyBtn.addEventListener('click', () => {
    if (!pixInput.value || pixInput.value.includes('Gerando')) return;
    navigator.clipboard.writeText(pixInput.value).then(() => {
      copyBtn.textContent = 'Copiado!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copiar chave Pix';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  });

  document.getElementById('cardBtn').addEventListener('click', () => {
    window.location.href = CARD_CHECKOUT_URL;
  });

  // Apple Pay real exige domínio verificado junto à Apple + Merchant ID
  // configurado no Mercado Pago. Esse botão aqui só redireciona pro cartão
  // por enquanto — quando tiver o Apple Pay configurado, troque essa ação.
  document.getElementById('appleBtn').addEventListener('click', () => {
    window.location.href = CARD_CHECKOUT_URL;
  });
</script>
</body>
</html>
