<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perfil Exclusivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f4f0;
    --card: #ffffff;
    --line: #ececec;
    --text: #1a1a1a;
    --text-dim: #8a8a8a;
    --orange-a: #ff8a3d;
    --orange-b: #ff5f6d;
    --gold: #f2a13c;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
  }

  .page{ max-width:480px; margin:0 auto; padding:18px 14px 60px; }

  .brand-header{
    text-align:center;
    padding:14px 0 18px;
    font-size:20px;
    font-weight:800;
    letter-spacing:0.5px;
    color: var(--text);
  }

  .card{
    background: var(--card);
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border:1px solid var(--line);
  }

  /* ---- Cover + Avatar ---- */
  .cover{
    height:150px; width:100%; object-fit:cover; display:block;
    background:#eee;
  }
  .profile-block{ padding:0 18px 16px; margin-top:-38px; }
  .avatar{
    width:76px; height:76px; border-radius:50%;
    border:4px solid var(--card);
    object-fit:cover; display:block; background:#ddd;
  }

  .stats-row{
    display:flex; justify-content:flex-end; gap:14px;
    margin-top:-30px; padding-bottom:6px;
    font-size:11.5px; color:var(--text-dim); font-weight:500;
  }
  .stats-row span{ display:inline-flex; align-items:center; gap:4px; }
  .stats-row svg{ width:13px; height:13px; }
  .stats-row .likes{ color:var(--orange-a); font-weight:700; }

  .name-row{
    display:flex; align-items:center; gap:5px;
    margin-top:4px;
  }
  .name-row h1{
    font-size:19px; font-weight:700; margin:0;
  }
  .badge{ width:16px; height:16px; flex-shrink:0; }
  .username{ font-size:13px; color:var(--text-dim); margin:2px 0 12px; }

  .social-row{ display:flex; gap:8px; margin-bottom:18px; }
  .social-row a{
    width:32px; height:32px; border-radius:9px;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); text-decoration:none;
  }
  .social-row svg{ width:15px; height:15px; }

  /* ---- Plans ---- */
  .section-label{
    font-size:13px; font-weight:700; color:var(--text);
    margin:0 0 8px;
  }
  .plan-btn{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; border:none; cursor:pointer;
    background: linear-gradient(90deg, var(--orange-a), var(--orange-b));
    color:#fff; font-family:'Poppins', sans-serif;
    padding:13px 18px; border-radius:30px;
    font-size:14px; font-weight:600;
    margin-bottom:10px;
    text-decoration:none;
    box-shadow: 0 4px 14px rgba(255,110,80,0.28);
  }
  .plan-btn .price{ font-weight:700; }
  .plan-btn.featured{ position:relative; }
  .plan-btn.featured::before{
    content:"MAIS POPULAR";
    position:absolute; top:-9px; left:16px;
    background:var(--gold); color:#fff;
    font-size:8.5px; font-weight:700; letter-spacing:0.5px;
    padding:2px 8px; border-radius:8px;
  }

  .promo-toggle{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; padding:8px 2px;
    font-size:12.5px; font-weight:600; color:var(--text-dim);
    border-top:1px solid var(--line); margin-top:4px;
  }
  .promo-toggle svg{ width:14px; height:14px; transition:transform 0.2s; }
  .promo-toggle.open svg{ transform:rotate(180deg); }
  .promo-plans{ display:none; margin-top:8px; }
  .promo-plans.open{ display:block; }
  .plan-btn.promo{
    background: linear-gradient(90deg, #ffb27a, var(--orange-a));
    box-shadow:none;
  }

  /* ---- Locked preview teaser ---- */
  .teaser{ margin-top:22px; border-top:1px solid var(--line); padding-top:16px; }
  .teaser-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .teaser-head img{ width:30px; height:30px; border-radius:50%; object-fit:cover; }
  .teaser-head .tn{ font-size:12.5px; font-weight:600; }
  .teaser-head .tu{ font-size:11px; color:var(--text-dim); }

  .teaser-media{
    position:relative; border-radius:14px; overflow:hidden;
    aspect-ratio:4/5; background:#f0ece7;
  }
  .teaser-media img{
    width:100%; height:100%; object-fit:cover;
    filter: blur(16px) brightness(0.85); transform:scale(1.15);
  }
  .teaser-lock{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .teaser-lock svg{ width:30px; height:30px; color:#fff; }
  .teaser-lock-stats{
    display:flex; gap:10px; font-size:11px; color:#fff; font-weight:600;
  }
  .teaser-lock-stats span{ display:flex; align-items:center; gap:3px; }
  .teaser-lock-stats svg{ width:12px; height:12px; }

  /* ---- Bottom CTA ---- */
  .cta-block{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg) 35%);
  }
  .cta{
    max-width:480px; margin:0 auto; display:block; width:100%;
    background: linear-gradient(90deg, var(--orange-a), var(--orange-b));
    color:#fff; text-decoration:none; text-align:center;
    padding:15px; border-radius:30px; font-weight:700; font-size:14.5px;
    box-shadow: 0 8px 24px rgba(255,110,80,0.35);
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand-header" id="brandHeader">Marca</div>
  <div class="card">

    <img class="cover" id="coverImg" src="https://i.postimg.cc/vTcspjMx/Design-sem-nome-(1).png" alt="capa">

    <div class="profile-block">
      <img class="avatar" id="avatarImg" src="https://i.postimg.cc/T2FMKtfJ/Gccoa-SUXYAAGu-Tw-(1).jpg" alt="avatar">

      <div class="stats-row">
        <span>📷 <b id="statPhotos">101</b></span>
        <span>🎬 <b id="statVideos">201</b></span>
        <span class="likes">❤ <b id="statLikes">4.2K</b></span>
      </div>

      <div class="name-row">
        <h1 id="profileName">Carolina</h1>
        <svg class="badge" viewBox="0 0 24 24" fill="#3897f0"><circle cx="12" cy="12" r="10"/><path d="M9.5 12.5l2 2 4-4.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="username" id="profileUsername">@carolinaaonf</div>

      <div class="social-row">
        <a href="https://www.instagram.com/carolinaonf__/
      " target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
        </a>
       
      </div>

      <div class="section-label">Assinaturas</div>

      <a class="plan-btn featured" href="#" data-plan="1mes">
        <span>1 mês</span>
        <span class="price">R$ 23,99</span>
      </a>

      <div class="promo-toggle" id="promoToggle">
        <span>Promoções</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="promo-plans" id="promoPlans">
        <a class="plan-btn promo" href="#" data-plan="3meses" style="margin-top:10px;">
          <span>3 meses <small style="opacity:0.85;">(10% off)</small></span>
          <span class="price">R$ 64,77</span>
        </a>
        <a class="plan-btn promo" href="#" data-plan="6meses">
          <span>6 meses <small style="opacity:0.85;">(15% off)</small></span>
          <span class="price">R$ 122,35</span>
        </a>
      </div>

      <div class="teaser">
        <div class="teaser-head">
          <img src="https://i.postimg.cc/T2FMKtfJ/Gccoa-SUXYAAGu-Tw-(1).jpg" alt="avatar">
          <div>
            <div class="tn" id="teaserName">Camila</div>
            <div class="tu" id="teaserUsername">@carolinaaonf</div>
          </div>
        </div>
        <div class="teaser-media">
          <img src="https://SEU-LINK-AQUI/prova1.jpg" alt="prévia">
          <div class="teaser-lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <div class="teaser-lock-stats">
              <span>📷 101</span><span>🎬 201</span><span>❤ 4.2K</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="cta-block">
  <a class="cta" id="mainCta" href="#">Quero acesso completo →</a>
</div>

<script>
  /* ============================================================
     CONFIGURAÇÃO — edite aqui
     ============================================================ */

  // Nome/marca que aparece no topo da página (acima do card)
  const BRAND_NAME = "Privacy";
  document.getElementById('brandHeader').textContent = BRAND_NAME;

  // Link de cada plano — pode ser Telegram (t.me/SEUBOT?start=xxx)
  // ou WhatsApp (https://wa.me/55SEUNUMERO?text=mensagem)
  const PLAN_LINKS = {
  "1mes":   "checkout.html?plano=1%20m%C3%AAs&valor=23.99",
  "3meses": "checkout.html?plano=3%20meses&valor=64.77",
  "6meses": "checkout.html?plano=6%20meses&valor=122.35",
};

const MAIN_CTA_LINK = PLAN_LINKS["1mes"];
  /* ============================================================ */

  document.querySelectorAll('.plan-btn[data-plan]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const plan = btn.getAttribute('data-plan');
      window.location.href = PLAN_LINKS[plan] || MAIN_CTA_LINK;
    });
  });

  document.getElementById('mainCta').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = MAIN_CTA_LINK;
  });

  const promoToggle = document.getElementById('promoToggle');
  const promoPlans = document.getElementById('promoPlans');
  promoToggle.addEventListener('click', () => {
    promoToggle.classList.toggle('open');
    promoPlans.classList.toggle('open');
  });
</script>
</body>
</html>
